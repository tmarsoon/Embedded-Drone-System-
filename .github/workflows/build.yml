name: Build and test integrated simulator
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure C++
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++
        run: cmake --build native/build --config Release --parallel 4
      - name: Test C++
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Test Java bridge and package interface
        run: mvn -B -C verify
      - name: Exercise actual JavaFX UI and C++ mission
        if: runner.os == 'Linux'
        run: bash scripts/smoke-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            target/surefire-reports
            runs/ui-smoke.png
